<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1c2a"/>
      <stop offset=".89" stop-color="#0f0e0f"/>
    </linearGradient>
    <radialGradient id="rim">
      <stop offset=".96" stop-color="#153739"/>
      <stop offset="1" stop-color="#8b9893"/>
    </radialGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>

  <!-- Steam -->
  <g fill="none" stroke="#9e829c" stroke-width="3" stroke-linecap="round">
    <path d="M34 34c-4-5 4-8 0-13"/>
    <path d="M50 34c-4-5 4-8 0-13"/>
    <path d="M66 34c-4-5 4-8 0-13"/>
  </g>

  <!-- Rim (dark teal with light edge highlight) -->
  <ellipse cx="50" cy="46.7" rx="41.3" ry="4.25" fill="url(#rim)"/>

  <!-- Coffee, offset down to show as a crescent at the front of the rim -->
  <ellipse cx="50" cy="51.3" rx="41.3" ry="4.25" fill="#2b1100"/>

  <!-- Cup body -->
  <path d="M91.3 46.7A41.3 4.25 0 0 1 8.7 46.7A41.3 35.75 0 0 0 91.3 46.7Z"
        fill="#8b9893"/>
</svg>